# Source: VATSIM Argentina operations manual v1.2.1 (Jan 2025, argentina.vatsur.org), same as SAEF.yaml.
# Reference point: SACO (Cordoba). Spoken in English as "<name> Control" like Ezeiza (Spanish "Centro"); not checked in the AIP.
# Only the first frequency is used for handoffs; the others answer too.
